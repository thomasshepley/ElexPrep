services:
  elexprep:
    build: .
    container_name: elexprep
    restart: unless-stopped
    ports:
      # Bound to the box's own loopback only - reachable over an SSH tunnel (see DEPLOY.md)
      # for initial admin setup and troubleshooting, never from the public internet. Caddy
      # below is the only service with a port actually published to 0.0.0.0.
      - "127.0.0.1:4000:4000"
    environment:
      # Required: a 64-hex-char (32-byte) AES-256-GCM key that encrypts crew compliance
      # documents, bank details, 2FA secrets, and the Current RMS/OneDrive API credentials at
      # rest - see DEPLOY.md's "Launch the instance" for the one-liner that generates it into
      # a sibling .env file (read here automatically by Compose's ${...} substitution). Keep
      # .env out of version control; losing this key makes anything already encrypted with it
      # unrecoverable.
      - CREW_DOC_ENCRYPTION_KEY=${CREW_DOC_ENCRYPTION_KEY}
      # Only set to true in .env once Caddy's certificate for your domain is live (see
      # DEPLOY.md's "Go live") - a Secure-flagged cookie is dropped by the browser on any
      # plain-HTTP request, which would break the SSH-tunnelled admin setup step that has to
      # happen before Caddy/DNS are wired up.
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      # Only needed if something other than this same box's Caddy ever calls the API
      # cross-origin with credentials - see DEPLOY.md's "Notes" section. Leave unset normally.
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
    volumes:
      # Database, logos, plots, and generated print-job PDFs all live here —
      # back this folder up and the whole app state comes with it.
      - ./data:/data

  # Reverse proxy + automatic HTTPS (Let's Encrypt) for the public domain - the only service
  # with ports actually open to the internet. See DEPLOY.md's "Go live at
  # portal.elex.lighting" for pointing DNS at this box and editing ./Caddyfile.
  caddy:
    image: caddy:2-alpine
    container_name: elexprep-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - elexprep

volumes:
  caddy_data:
  caddy_config:
