services:
  elexprep:
    build: .
    container_name: elexprep
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      # Required: a 64-hex-char (32-byte) AES-256-GCM key that encrypts crew compliance
      # documents, bank details, and 2FA secrets at rest — see DEPLOY.md's "First
      # deployment" for the one-liner that generates it into a sibling .env file (read
      # here automatically by Compose's ${...} substitution). Keep .env out of version
      # control; losing this key makes anything already encrypted with it unrecoverable.
      - CREW_DOC_ENCRYPTION_KEY=${CREW_DOC_ENCRYPTION_KEY}
      # Only set to true in .env once EVERY login goes through HTTPS (see DEPLOY.md's
      # "Going live at portal.elex.lighting") — a Secure-flagged cookie is dropped by the
      # browser on any plain-HTTP request, which would break login for whichever access
      # path doesn't use TLS (e.g. a prep-bay signage TV still on a plain http://<lan-ip>
      # address). Defaults to false, which works correctly either way, just without that
      # extra hardening.
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
    volumes:
      # Database, logos, plots, and generated print-job PDFs all live here —
      # back this folder up and the whole app state comes with it.
      - ./data:/data

  # Cloudflare Tunnel: exposes the app at your chosen hostname (set up in the Zero Trust
  # dashboard under Networks -> Tunnels) without opening any port on your router. Uncomment
  # once you have a tunnel token (paste it into a .env file next to this compose file as
  # CLOUDFLARE_TUNNEL_TOKEN) — left commented out by default so an unconfigured token
  # doesn't crash-loop this container. For a quick, temporary preview URL instead (no token
  # needed), run `cloudflared tunnel --url http://localhost:4000` on the host directly.
  # cloudflared:
  #   image: cloudflare/cloudflared:latest
  #   container_name: elexprep-cloudflared
  #   restart: unless-stopped
  #   command: tunnel run
  #   environment:
  #     # Paste the tunnel token from Zero Trust -> Networks -> Tunnels -> (your tunnel) ->
  #     # "Install connector" step.
  #     - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
  #   depends_on:
  #     - elexprep
