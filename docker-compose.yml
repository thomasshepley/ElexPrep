services:
  elexprep:
    build: .
    container_name: elexprep
    restart: unless-stopped
    ports:
      - "4000:4000"
    # environment:
    #   Required: a 64-hex-char (32-byte) AES-256-GCM key that encrypts crew compliance
    #   documents at rest. Generate one with
    #   `node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"` and keep it
    #   out of version control — crew document upload/download is unavailable without it, and
    #   losing it makes any already-uploaded documents unrecoverable.
    #   - CREW_DOC_ENCRYPTION_KEY=
    #
    #   Only set COOKIE_SECURE=true if EVERY login will go through the https:// tunnel
    #   hostname from now on, including on-site (e.g. prep-bay signage TVs switched to the
    #   tunnel URL instead of a plain http://<lan-ip>:4000 address) — a Secure-flagged
    #   cookie is dropped by the browser on any plain-HTTP request, which would break login
    #   for whichever access path doesn't use HTTPS. Leaving this false (the default) still
    #   works correctly over the HTTPS tunnel; it just doesn't add that extra hardening.
    #   - COOKIE_SECURE=true
    volumes:
      # Database, logos, plots, and generated print-job PDFs all live here —
      # back this folder up and the whole app state comes with it.
      - ./data:/data

  # Cloudflare Tunnel: exposes the app at your chosen hostname (set up in the Zero Trust
  # dashboard under Networks -> Tunnels) without opening any port on your router. Uncomment
  # once you have a tunnel token (paste it into a .env file next to this compose file as
  # CLOUDFLARE_TUNNEL_TOKEN) — left commented out by default so an unconfigured token
  # doesn't crash-loop this container. For a quick, temporary preview URL instead (no token
  # needed), run `cloudflared tunnel --url http://localhost:4000` on the host directly.
  # cloudflared:
  #   image: cloudflare/cloudflared:latest
  #   container_name: elexprep-cloudflared
  #   restart: unless-stopped
  #   command: tunnel run
  #   environment:
  #     # Paste the tunnel token from Zero Trust -> Networks -> Tunnels -> (your tunnel) ->
  #     # "Install connector" step.
  #     - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
  #   depends_on:
  #     - elexprep
